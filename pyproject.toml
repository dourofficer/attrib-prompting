[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attrib-prompting"
version = "0.1.0"
description = "Standalone reproduction of prompting-based failure-attribution baselines (Who&When all-at-once / step-by-step / binary-search) on Who&When, CORRECT-Error and TraceElephant"
requires-python = ">=3.10"
# CPU-only core: enough for evaluation (report/reparse), tests, sweep dry-runs
# and the dummy backend. Inference needs an extra (below).
dependencies = [
    "pyyaml",
    "pandas",
    "rich",
]

[project.optional-dependencies]
# Local-checkpoint inference. vLLM is deliberately unpinned: pinning it is
# hazardous across CUDA stacks — install the build that matches your driver.
vllm = ["vllm", "transformers"]
# OpenAI-compatible API inference (GPT-5, GPT-4o, any base_url-compatible provider).
api = ["openai>=1.0"]
# CHIEF's offline retrieval stage (baselines/chief/ragprep.py), which reads the
# committed FAISS indices under vendored/CHIEF/rag/. Needed only to rebuild the
# exemplar artifacts — artifacts/ is committed, so running or evaluating CHIEF
# needs neither of these.
rag = ["faiss-cpu", "sentence-transformers"]
# One-off corpus construction (misc/build_correct_error_gt.py): reads the
# source benchmarks' parquet from the HF cache. Not needed to run or evaluate
# anything — data/ is committed.
data = ["pyarrow", "datasets"]
# scikit-learn (with the [vllm] extra's torch/transformers) enables the
# similarity-ranking parity test in tests/test_correct_similarity.py, which
# skips cleanly when they are absent; `pytest tests/` needs nothing beyond
# pytest. sklearn is also the vendored cosine-similarity dependency for
# baselines/correct/similarity.py real runs.
dev = ["pytest", "scikit-learn"]
# The representation-based baselines (baselines-rp/): OAT reads hidden states
# out of a local checkpoint with transformers, projects them with scikit-learn's
# PCA, and fits a neural controlled differential equation with torchcde on top
# of torchdiffeq. torch is unpinned for the same reason vllm is — match your
# CUDA stack.
rb = [
    "torch",
    "transformers",
    "scikit-learn",
    "joblib",
    "torchcde>=0.2.5",
    "torchdiffeq>=0.2.5",
]

[tool.setuptools.packages.find]
# Two source roots. The repo root carries the prompting-based `baselines/`
# package; `baselines-rp/` carries the representation-based family. Its hyphen
# is deliberate: the directory cannot be imported as a package, so the two
# trees can never collide, while the packages inside it (`oat`, `rb_shared`)
# import by plain name.
where = [".", "baselines-rp"]
include = ["baselines*", "oat*", "rb_shared*", "stepfinder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
