[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attrib-prompting"
version = "0.1.0"
description = "Standalone reproduction of prompting-based failure-attribution baselines (Who&When all-at-once / step-by-step / binary-search) on Who&When, CORRECT-Error and TraceElephant"
requires-python = ">=3.10"
# CPU-only core: enough for evaluation (report/reparse), tests, sweep dry-runs
# and the dummy backend. Inference needs an extra (below).
dependencies = [
    "pyyaml",
    "pandas",
    "rich",
]

[project.optional-dependencies]
# Local-checkpoint inference. vLLM is deliberately unpinned: pinning it is
# hazardous across CUDA stacks — install the build that matches your driver.
vllm = ["vllm", "transformers"]
# OpenAI-compatible API inference (GPT-5, GPT-4o, any base_url-compatible provider).
api = ["openai>=1.0"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["baselines*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
