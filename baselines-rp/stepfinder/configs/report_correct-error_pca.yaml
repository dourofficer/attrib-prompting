# The PCA-reduction family: same protocol as the slice family, but each
# step vector is the top-128 principal projection of the full embedding
# instead of its first 128 coordinates (see reduce.py).
models:  [qwen3-embedding-0.6b, qwen3.5-9b, deepseek-8b, qwen3.5-4b, qwen3-14b, qwen3.5-27b]
subsets: [arc, gaia, hotpot, math500, mmlu_pro, musique, wikimqa]
methods: [stepfinder-pca.s42, stepfinder-pca.s43, stepfinder-pca.s44, stepfinder-pca.s45, stepfinder-pca.s46]
data_dir: data/correct-error
pred_root: outputs-rb-gt/correct-error
out_root:  outputs-rb-gt/correct-error/reports/stepfinder-pca
gt: without
splits: {train: 0.3, val: 0.2, test: 0.5}
seeds: [1, 2, 3]
