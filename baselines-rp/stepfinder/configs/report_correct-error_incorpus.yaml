# Scoring the in-corpus family. Each stepfinder.e<s> predicts only seed s's
# val+test ids, so `--check-only` reads PARTIAL by construction and the
# shared table is meaningful only on its diagonal. Run with --diagonal to get
# diagonal.tsv beside it.
models:  [qwen3-embedding-0.6b, qwen3.5-9b, deepseek-8b]
subsets: [arc, gaia, hotpot, math500, mmlu_pro, musique, wikimqa]
methods: [stepfinder.e1, stepfinder.e2, stepfinder.e3]
data_dir: data/correct-error
pred_root: outputs-rb-gt/correct-error
out_root:  outputs-rb-gt/correct-error/reports/stepfinder-incorpus
gt: without
splits: {train: 0.3, val: 0.2, test: 0.5}
seeds: [1, 2, 3]
