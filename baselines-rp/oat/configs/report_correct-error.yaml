# Scoring OAT on correct-error with the repo's shared protocol: step@1 and agent@1 over
# the same seeded val/test splits every other baseline is scored on.
# One method directory per training seed, so the table shows the spread across
# seeds rather than hiding it in a mean.
models:  [qwen3.5-9b, deepseek-8b]
subsets: ['arc', 'gaia', 'hotpot', 'math500', 'mmlu_pro', 'musique', 'wikimqa']
methods: [oat.s42, oat.s43, oat.s44, oat.s45, oat.s46]
data_dir: data/correct-error
pred_root: outputs-rb-gt/correct-error
out_root:  outputs-rb-gt/correct-error/reports/oat
gt: without
splits: {train: 0.3, val: 0.2, test: 0.5}
seeds: [1, 2, 3]
