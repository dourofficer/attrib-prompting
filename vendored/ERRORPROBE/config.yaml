# Configuration for the self-improving error diagnosis system.
#
# Models are called through LiteLLM, so any supported provider works.
# Set the credentials for your provider via environment variables
# (e.g. OPENAI_API_KEY, ANTHROPIC_API_KEY) before running.
# See https://docs.litellm.ai/docs/providers for the full list.

model:
  # Examples:
  #   - "anthropic/claude-3-5-sonnet-20241022"
  #   - "openai/gpt-4o"
  model_id: "anthropic/claude-3-5-sonnet-20241022"

  max_tokens: 4000
  temperature: 0.7

agents:
  # Maximum steps each agent can take
  max_steps: 3

  # Verbosity level (0=silent, 1=normal, 2=verbose)
  verbosity: 1

  # Maximum iterations for multi-agent collaboration
  max_iterations: 2

memory:
  # Path to the persisted error-pattern memory
  memory_file: "memory/epm.json"

  # Trigger evolution after this many concrete failures
  evolution_trigger: 10

  # Minimum cluster size for pattern abstraction
  min_cluster_size: 3

evaluation:
  max_traces_per_dataset: 50
  output_dir: "runs"

# Optional: backward tracing from the failure symptom to the root cause,
# instead of analyzing a truncated window of the trace.
backward_tracing:
  enabled: false
  max_turns: 100
  context_radius: 5
  confidence_threshold: 0.75
  min_turns: 10

logging:
  level: "INFO"
  log_file: ""
