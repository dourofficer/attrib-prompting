# Inference config — Who&When (ww), local vLLM models.
# Closed-source API models have their own config: ww-api.yaml.
models:  [qwen3.5-9b, deepseek-8b]
subsets: [algorithm-generated, hand-crafted]
methods: [all_at_once, step_by_step, binary_search]

data_dir:     data/ww
outputs_root: outputs/ww          # → outputs/ww/<subset>/<model>/<method>/<id>.json

# vLLM sampling/runtime defaults (a model spec may override any of these).
dtype:          bfloat16
seed:           0
temperature:    0.6
top_p:          0.95
gen_max_tokens: 1024
enable_thinking: false          # toggle reasoning here (honored where the template supports it)

# Longest full-history prompt across all datasets is ~98k tokens (p99 ~29k).
# Both checkpoints natively support ≥128k, so 131072 covers 100% with no
# truncation. Drop to 65536 to save KV memory (covers 99.9%; set
# truncate_prompt_tokens below to avoid erroring on the rare longer prompt).
max_model_len:          131072
truncate_prompt_tokens: null
gpu_memory_utilization: 0.90
tensor_parallel_size:   1

start_idx: 0
end_idx:   null

# step_mode: auto            # step_by_step: batch on vllm, early_stop on API

model_specs:
  qwen3.5-9b:
    backend: vllm
    model_path: ../hub/Qwen/Qwen3.5-9B
  deepseek-8b:
    backend: vllm
    model_path: ../hub/deepseek-ai/DeepSeek-R1-Distill-Llama-8B
    # Corrected tokenizer: the checkpoint's tokenizer_config sets
    # tokenizer_class=LlamaTokenizerFast, which makes transformers build a
    # SentencePiece tokenizer that ignores the llama-3 ByteLevel tokenizer.json
    # and mangles spaces. This repo-local copy fixes only tokenizer_class.
    tokenizer: baselines/prompting/tokenizers/deepseek-8b
    # R1-Distill always emits <think>; 1024 would truncate the actual answer.
    gen_max_tokens: 8192
