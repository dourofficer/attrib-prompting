# Inference config — CORRECT-Error.
models:  [qwen3.5-9b, deepseek-8b]
subsets: [arc, gaia, hotpot, math500, mmlu_pro, musique, wikimqa]
methods: [all_at_once, step_by_step, binary_search]

data_dir:     data/correct-error
outputs_root: outputs/correct-error   # → outputs/correct-error/<subset>/<model>/<method>/<id>.json

# vLLM sampling/runtime defaults (a model spec may override any of these).
dtype:          bfloat16
seed:           0
temperature:    0.6
top_p:          0.95
gen_max_tokens: 1024
enable_thinking: false

# Longest full-history prompt across all datasets is ~98k tokens (p99 ~29k).
# Both checkpoints natively support ≥128k, so 131072 covers 100% with no
# truncation. Drop to 65536 to save KV memory (covers 99.9%; set
# truncate_prompt_tokens below to avoid erroring on the rare longer prompt).
max_model_len:          131072
truncate_prompt_tokens: null
gpu_memory_utilization: 0.45
tensor_parallel_size:   1

start_idx: 0
end_idx:   null

model_specs:
  qwen3.5-9b:
    backend: vllm
    model_path: ../hub/Qwen/Qwen3.5-9B
  deepseek-8b:
    backend: vllm
    model_path: ../hub/deepseek-ai/DeepSeek-R1-Distill-Llama-8B
    # Corrected tokenizer (fixes only tokenizer_class; see configs/ww.yaml).
    tokenizer: baselines/prompting/tokenizers/deepseek-8b
    # R1-Distill always emits <think>; 1024 would truncate the actual answer.
    gen_max_tokens: 8192
  # API models — add them to `models:` above once an API key is available.
  gpt-4o:
    backend: openai
    model: gpt-4o
    params: {max_tokens: 1024, temperature: 0.6, top_p: 0.95, seed: 0}
  gpt-5:
    backend: openai
    model: gpt-5
    params: {max_completion_tokens: 4096}  # reasoning model: rejects temperature/top_p
