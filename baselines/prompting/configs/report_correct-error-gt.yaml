# Report config — CORRECT-Error (with ground truth).
models:  [qwen3.5-9b, deepseek-8b, gpt-4o, gpt-5]
subsets: [arc, gaia, hotpot, math500, mmlu_pro, musique, wikimqa]
methods: [all_at_once, step_by_step, binary_search]

data_dir:  data/correct-error-gt
pred_root: outputs/correct-error-gt
out_root:  outputs/correct-error-gt/reports

splits: {train: 0.3, val: 0.2, test: 0.5}
seeds:  [1, 2, 3]

# correct-error-gt restores the task answer (scripts/build_correct_error_gt.py),
# so the answer IS in the prompts. Pairs 1:1 with report_correct-error.yaml:
# same corpus, same filename stems, therefore identical per-seed splits.
gt_in_prompt: true
