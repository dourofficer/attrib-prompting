models:  [qwen3.5-9b, deepseek-8b]
subsets: [arc, gaia, hotpot, math500, mmlu_pro, musique, wikimqa]
methods: [all_at_once, step_by_step, binary_search]

pred_root: outputs-correct-error/prompting

reps_root:   outputs-correct-error/activations
split_model: qwen3.5-9b
splits: {train: 0.3, val: 0.2, test: 0.5}

crr_reduced_root: outputs-correct-error/discounted-splits/reduced/325

out_root: outputs-correct-error/prompting-reports

# correct-error has NO ground_truth stored, so the answer is NOT in the prompts.
gt_in_prompt: false

# seeds: omit to auto-read from the CRR reduced table (canonical).
