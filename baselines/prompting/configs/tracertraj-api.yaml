# Inference config — TracerTraj, closed-source API models.
# Requires the model's API key in the environment (default: OPENAI_API_KEY).
models:  [gpt-4o, gpt-5]
subsets: [code]
methods: [all_at_once, step_by_step, binary_search]

data_dir:     data/tracertraj
outputs_root: outputs/tracertraj

# step_mode: auto                 # early_stop on API backends (see ww-api.yaml)

start_idx: 0
end_idx:   null

model_specs:
  gpt-4o:
    backend: openai
    model: gpt-4o
    params: {max_tokens: 1024, temperature: 0.6, top_p: 0.95, seed: 0}
  gpt-5:
    backend: openai
    model: gpt-5
    params: {max_completion_tokens: 16384}  # reasoning model: rejects temperature/top_p
