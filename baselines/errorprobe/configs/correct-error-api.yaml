# ErrorProbe inference config — CORRECT-Error, closed-source API models.
# Requires the model's API key in the environment (default: OPENAI_API_KEY).
# 2,226 trajectories — budget before sweeping, especially the backward mode.
models:  [gpt-4o, gpt-5]
subsets: [arc, gaia, hotpot, math500, mmlu_pro, musique, wikimqa]

data_dir:     data/correct-error
outputs_root: outputs/correct-error

# Vendored setting: no task answer in the prompts (outputs-nogt/ tree).
gt: without

# Only the cheap vendored default here; enable backward deliberately
# (`--set modes=[backward]`) — it multiplies the call count by the trace length.
modes: [truncated]

start_idx: 0
end_idx:   null

model_specs:
  gpt-4o:
    backend: openai
    model: gpt-4o
    params: {max_tokens: 4000, temperature: 0.7}
  gpt-5:
    backend: openai
    model: gpt-5
    params: {max_completion_tokens: 16384, reasoning_effort: low}
