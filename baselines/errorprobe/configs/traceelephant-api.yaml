# ErrorProbe inference config — TraceElephant, closed-source API models.
# Requires the model's API key in the environment (default: OPENAI_API_KEY).
models:  [gpt-4o, gpt-5]
subsets: [magentic, captain]

data_dir:     data/traceelephant
outputs_root: outputs/traceelephant

# Vendored setting: no task answer in the prompts (outputs-nogt/ tree).
gt: without

# truncated = the vendored default; backward walks the full trace — these
# subsets run long (100+ turns), so budget before enabling backward.
modes: [truncated, backward]

# The paper's own pipeline (MAST tagger -> dependency graph -> Strategist /
# Investigator / Arbiter; built from the paper, no vendored counterpart) is
# opt-in: MODE=paper bash scripts/errorprobe/run.sh. Its knobs, read only when
# `paper` is among the modes:
paper:
  max_hypotheses: 3          # Investigator calls per trajectory
  chunk_chars: 12000         # tagger / dependency chunk size (rendered chars)
  condensed_chars: 20000     # budget for the condensed trace the team reads
  include_mast_examples: false   # the MAST authors' worked examples, ~17k tokens per tagger prompt
  sequential_edges: fallback     # 'always' disables masking (ablation)

start_idx: 0
end_idx:   null

model_specs:
  gpt-4o:
    backend: openai
    model: gpt-4o
    params: {max_tokens: 4000, temperature: 0.7}
  gpt-5:
    backend: openai
    model: gpt-5
    params: {max_completion_tokens: 16384, reasoning_effort: low}
