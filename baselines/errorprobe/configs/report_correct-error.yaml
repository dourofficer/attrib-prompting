# Report config — CORRECT-Error, ErrorProbe baseline.
# Default GT setting is `without` (the vendored setting): reads outputs-nogt/
# and writes outputs-nogt/correct-error/reports/errorprobe.
# gpt-5 is deliberately excluded on correct-error (too costly, as for the
# other baselines); add it here only if that decision changes.
models:  [gpt-4o]
subsets: [arc, gaia, hotpot, math500, mmlu_pro, musique, wikimqa]
methods: [errorprobe, errorprobe_bt]

gt: without

data_dir:  data/correct-error
pred_root: outputs/correct-error
out_root:  outputs/correct-error/reports/errorprobe

splits: {train: 0.3, val: 0.2, test: 0.5}
seeds:  [1, 2, 3]

# Describes the with-GT tree only (restored answers); --gt without reports False.
gt_in_prompt: true
