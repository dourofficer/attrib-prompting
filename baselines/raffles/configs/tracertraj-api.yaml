# RAFFLES inference config — TracerTraj, closed-source API models.
# Requires the model's API key in the environment (default: OPENAI_API_KEY).
models:  [gpt-4o, gpt-5]
subsets: [code]

data_dir:     data/tracertraj
outputs_root: outputs/tracertraj

# Paper setting: no ground truth in the prompts (outputs-nogt/ tree).
gt: without

max_iters: 2
threshold: 350

start_idx: 0
end_idx:   null

model_specs:
  gpt-4o:
    backend: openai
    model: gpt-4o
    params: {max_tokens: 8192, temperature: 0.6}
  gpt-5:
    backend: openai
    model: gpt-5
    params: {max_completion_tokens: 16384, reasoning_effort: low}
