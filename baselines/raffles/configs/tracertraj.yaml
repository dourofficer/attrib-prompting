# RAFFLES inference config — TracerTraj, local vLLM models.
# Closed-source API models have their own config: tracertraj-api.yaml.
models:  [qwen3.5-9b, deepseek-8b]
subsets: [code]

data_dir:     data/tracertraj
outputs_root: outputs/tracertraj

# Paper setting: RAFFLES evaluates without ground truth, so the default tree is
# outputs-nogt/.
gt: without

# K = extra Judge-Evaluator iterations after the first pass. 2 is the paper's
# main-table setting; its Who&When SOTA row uses 5 — run that side by side with
# `--set max_iters=5 --set method_dir=raffles.k5`. threshold is the paper's
# early-stop confidence (of 400).
max_iters: 2
threshold: 350

# Sampling — greedy, as the paper ("a greedy search is used"). The API configs
# send 0.6; local runs follow the paper, and _run.json records either verbatim.
dtype:          bfloat16
seed:           0
temperature:    0.0
top_p:          1.0
gen_max_tokens: 2048
enable_thinking: false

# The Judge sees the full history plus prior-iteration feedback; the longest
# tracertraj history is ~73k Qwen tokens on its own.
max_model_len:          131072
truncate_prompt_tokens: null
gpu_memory_utilization: 0.90
tensor_parallel_size:   1

start_idx: 0
end_idx:   null

model_specs:
  qwen3.5-9b:
    backend: vllm
    model_path: ../hub/Qwen/Qwen3.5-9B
  deepseek-8b:
    backend: vllm
    model_path: ../hub/deepseek-ai/DeepSeek-R1-Distill-Llama-8B
    # Corrected tokenizer (see baselines/prompting/configs/ww.yaml).
    tokenizer: baselines/prompting/tokenizers/deepseek-8b
    # R1-Distill always emits <think>; 2048 would truncate the actual answer.
    gen_max_tokens: 8192
