models:  [qwen3.5-9b, deepseek-8b]
subsets: [arc, gaia, hotpot, math500, mmlu_pro, musique, wikimqa]
data_dir: data/correct-error-gt

methods: [correct]

pred_root: outputs-correct-error-gt/correct

reps_root:   outputs-correct-error-gt/activations
split_model: qwen3.5-9b
splits: {train: 0.3, val: 0.2, test: 0.5}

crr_reduced_root: outputs-correct-error-gt/discounted-splits/reduced/325

out_root: outputs-correct-error-gt/correct-reports

# Still false: CORRECT's vendored vLLM *detection* prompt excludes the gold answer
# on every dataset. What correct-error-gt changes for this baseline is stage 1 —
# schema generation now sees the answer, as the paper's Fig. 9 prompt intends
# (`Ground Truth: {ground truth}`), instead of interpolating an empty string.
gt_in_prompt: false
