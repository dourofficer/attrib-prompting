# CORRECT inference config — CORRECT-Error, closed-source API models.
# Requires the model's API key in the environment (default: OPENAI_API_KEY).
models:  [gpt-4o, gpt-5]
subsets: [arc, gaia, hotpot, math500, mmlu_pro, musique, wikimqa]
methods: [correct]

data_dir:     data/correct-error
outputs_root: outputs/correct-error

gt: without

schema_model: gpt-4o
embed_model:  ../hub/BAAI/bge-m3
num_schemata: 5                     # paper A.3: k=5 for all CORRECT-Error runs

schema_gen:
  params: {max_tokens: 4096}

start_idx: 0
end_idx:   null

model_specs:
  gpt-4o:
    backend: openai
    model: gpt-4o
    params: {max_tokens: 8192}
  gpt-5:
    backend: openai
    model: gpt-5
    params: {max_completion_tokens: 8192, reasoning_effort: medium}
