# CORRECT inference config — TraceElephant, closed-source API models.
# Requires the model's API key in the environment (default: OPENAI_API_KEY).
models:  [gpt-4o, gpt-5]
subsets: [magentic, captain]
methods: [correct, correct_baseline]

data_dir:     data/traceelephant
outputs_root: outputs/traceelephant

gt: without

schema_model: gpt-4o
embed_model:  ../hub/BAAI/bge-m3
num_schemata: 10                    # not in the paper; hand-crafted-like default

schema_gen:
  params: {max_tokens: 4096}

start_idx: 0
end_idx:   null

model_specs:
  gpt-4o:
    backend: openai
    model: gpt-4o
    params: {max_tokens: 8192}
  gpt-5:
    backend: openai
    model: gpt-5
    params: {max_completion_tokens: 8192, reasoning_effort: medium}
