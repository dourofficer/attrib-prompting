# CORRECT inference config — TracerTraj, closed-source API models.
# Requires the model's API key in the environment (default: OPENAI_API_KEY).
models:  [gpt-4o, gpt-5]
subsets: [code]
methods: [correct]

data_dir:     data/tracertraj
outputs_root: outputs/tracertraj
# Stage-1/2 artifacts (schemata, similarities) — never predictions.
artifacts_root: artifacts/tracertraj

gt: without

schema_model: gpt-4o
embed_model:  ../hub/BAAI/bge-m3
num_schemata: 10                    # not in the paper; hand-crafted-like default (as traceelephant)

schema_gen:
  params: {max_tokens: 4096}

start_idx: 0
end_idx:   null

model_specs:
  gpt-4o:
    backend: openai
    model: gpt-4o
    params: {max_tokens: 8192}
  gpt-5:
    backend: openai
    model: gpt-5
    params: {max_completion_tokens: 8192, reasoning_effort: medium}
