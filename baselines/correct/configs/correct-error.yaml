# CORRECT inference config — CORRECT-Error, local vLLM models.
# Closed-source API models have their own config: correct-error-api.yaml.
# Note: data/correct-error carries the restored task answers; run against
# data/correct-error-nogt (--set data_dir=... outputs_root=...) to reproduce
# the as-released corpus whose ground-truth slot is blank in schemagen.
models:  [qwen3.5-9b, deepseek-8b]
subsets: [arc, gaia, hotpot, math500, mmlu_pro, musique, wikimqa]
methods: [correct, correct_baseline]

data_dir:     data/correct-error
outputs_root: outputs/correct-error

# Paper setting: the detection prompt never contains the answer.
gt: without

schema_model: qwen3.5-9b
embed_model:  ../hub/BAAI/bge-m3
num_schemata: 5                     # paper A.3: k=5 for all CORRECT-Error runs

schema_gen: {temperature: 0.7, top_p: 0.95, gen_max_tokens: 1024}

# Detection sampling — greedy, as the vendored local CORRECT inference.
dtype:          bfloat16
seed:           0
temperature:    0.0
top_p:          1.0
gen_max_tokens: 1024
enable_thinking: false

max_model_len:          131072
truncate_prompt_tokens: null
gpu_memory_utilization: 0.90
tensor_parallel_size:   1

start_idx: 0
end_idx:   null

model_specs:
  qwen3.5-9b:
    backend: vllm
    model_path: ../hub/Qwen/Qwen3.5-9B
  deepseek-8b:
    backend: vllm
    tokenizer: baselines/prompting/tokenizers/deepseek-8b
    model_path: ../hub/deepseek-ai/DeepSeek-R1-Distill-Llama-8B
    gen_max_tokens: 8192
