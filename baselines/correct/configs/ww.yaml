# CORRECT inference config — Who&When (ww), local vLLM models.
# Closed-source API models have their own config: ww-api.yaml.
# Runs all 3 stages: schemagen → similarity → predict (see sweep.py).
models:  [qwen3.5-9b, deepseek-8b]
subsets: [algorithm-generated, hand-crafted]
methods: [correct, correct_baseline]

data_dir:     data/ww
outputs_root: outputs/ww    # stage-1/2 artifacts + with-GT detection; without-GT
                            # detection mirrors into outputs-nogt/ww

# The vendored cloud path never puts the task answer in the detection prompt:
# without-GT is the paper setting and this baseline's default. Run
# `--gt with` for the with-GT extension (answer line inserted, outputs/ tree).
gt: without

# Stage 1+3 pipeline knobs.
schema_model: qwen3.5-9b            # distills the schemata; all detectors share them
embed_model:  ../hub/BAAI/bge-m3    # stage-2 similarity encoder (vendored BGE-M3)
num_schemata:                       # top-k retrieved schemata (paper A.3)
  algorithm-generated: 1
  hand-crafted: 10

# Stage-1 sampling (the vendored schema generator's SamplingParams).
schema_gen: {temperature: 0.7, top_p: 0.95, gen_max_tokens: 1024}

# Detection sampling — greedy, as the vendored local CORRECT inference
# (a model spec may override any of these).
dtype:          bfloat16
seed:           0
temperature:    0.0
top_p:          1.0
gen_max_tokens: 1024
enable_thinking: false

# Longest full-history prompt across all datasets is ~98k tokens (p99 ~29k);
# retrieved schemata add ~1k each. Both checkpoints natively support ≥128k.
max_model_len:          131072
truncate_prompt_tokens: null
gpu_memory_utilization: 0.90
tensor_parallel_size:   1

start_idx: 0
end_idx:   null

model_specs:
  qwen3.5-9b:
    backend: vllm
    model_path: ../hub/Qwen/Qwen3.5-9B
  deepseek-8b:
    backend: vllm
    model_path: ../hub/deepseek-ai/DeepSeek-R1-Distill-Llama-8B
    # Corrected tokenizer (see baselines/prompting/configs/ww.yaml).
    tokenizer: baselines/prompting/tokenizers/deepseek-8b
    # R1-Distill always emits <think>; 1024 would truncate the actual answer.
    gen_max_tokens: 8192
