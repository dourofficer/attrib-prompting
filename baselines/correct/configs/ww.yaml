# CORRECT inference config — Who&When (ww), local vLLM models.
# Closed-source API models have their own config: ww-api.yaml.
models:  [qwen3.5-9b, deepseek-8b]
subsets: [algorithm-generated, hand-crafted]
methods: [correct]

data_dir:     data/ww
outputs_root: outputs/ww
# Stage-1/2 artifacts (schemata, similarities) — never predictions.
artifacts_root: artifacts/ww

# Paper setting (the vendored cloud path never includes the answer).
gt: without

# The schemata are keyed by their generator, not by the detector, and the GPT-4o
# ones are already committed under artifacts/ — so stage 1 is skipped and this
# local detector reads them. Run with STAGES=predict; a --dry-run over all three
# stages would ask for a gpt-4o spec, which a vLLM config must not carry.
schema_model: gpt-4o
embed_model:  ../hub/BAAI/bge-m3    # stage 2 runs locally (CPU works, GPU faster)
num_schemata:
  algorithm-generated: 1            # paper A.3: K_AG=1
  hand-crafted: 10                  #            K_HC=10

# Stage-1 sampling = the vendored schema generator's SamplingParams. Unused
# while schema_model is a closed-source model, kept so the block is complete.
schema_gen: {temperature: 0.7, top_p: 0.95, gen_max_tokens: 1024}

# Detection sampling — greedy, as the vendored local inference.
dtype:          bfloat16
seed:           0
temperature:    0.0
top_p:          1.0
gen_max_tokens: 1024
enable_thinking: false

# Longest full-history prompt across all datasets is ~98k tokens (p99 ~29k);
# retrieved schemata add ~1k each.
max_model_len:          131072
truncate_prompt_tokens: null
gpu_memory_utilization: 0.90
tensor_parallel_size:   1

start_idx: 0
end_idx:   null

model_specs:
  qwen3.5-9b:
    backend: vllm
    model_path: ../hub/Qwen/Qwen3.5-9B
  deepseek-8b:
    backend: vllm
    model_path: ../hub/deepseek-ai/DeepSeek-R1-Distill-Llama-8B
    # Corrected tokenizer (see baselines/prompting/configs/ww.yaml).
    tokenizer: baselines/prompting/tokenizers/deepseek-8b
    # R1-Distill always emits <think>; 1024 would truncate the actual answer.
    gen_max_tokens: 8192
