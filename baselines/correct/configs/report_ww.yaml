models:  [qwen3.5-9b, deepseek-8b]
subsets: [algorithm-generated, hand-crafted]
methods: [correct]

pred_root: outputs-ww/correct

# Split source: reproduce the SAME per-seed val/test splits CRR/SVD used.
# reps id-set == full data, so the split is model-independent; use split_model
# (present for every dataset) as the canonical id-source.
reps_root:   outputs-ww/activations
split_model: qwen3.5-9b
splits: {train: 0.3, val: 0.2, test: 0.5}       # the "325" folder

# SVD (undisc_*) + CRR (disc_*) numbers to place side-by-side, best pooling per seed.
crr_reduced_root: outputs-ww/discounted-splits/reduced/325

out_root: outputs-ww/correct-reports

# CORRECT's vendored vLLM prompt excludes the gold answer on every dataset.
gt_in_prompt: false

# seeds: omit to auto-read from the CRR reduced table (canonical). Set to override.
