# CORRECT inference config — TraceElephant, local vLLM models.
# Closed-source API models have their own config: traceelephant-api.yaml.
models:  [qwen3.5-9b, deepseek-8b]
subsets: [magentic, captain]
methods: [correct, correct_baseline]

data_dir:     data/traceelephant
outputs_root: outputs/traceelephant

# Paper setting: the detection prompt never contains the answer.
gt: without

schema_model: qwen3.5-9b
embed_model:  ../hub/BAAI/bge-m3
# TraceElephant is not in the paper; its trajectories are long GAIA-style runs
# like Who&When hand-crafted, so we default to that k. Config-overridable.
num_schemata: 10

schema_gen: {temperature: 0.7, top_p: 0.95, gen_max_tokens: 1024}

# Detection sampling — greedy, as the vendored local CORRECT inference.
dtype:          bfloat16
seed:           0
temperature:    0.0
top_p:          1.0
gen_max_tokens: 1024
enable_thinking: false

max_model_len:          131072
truncate_prompt_tokens: null
gpu_memory_utilization: 0.90
tensor_parallel_size:   1

start_idx: 0
end_idx:   null

model_specs:
  qwen3.5-9b:
    backend: vllm
    model_path: ../hub/Qwen/Qwen3.5-9B
  deepseek-8b:
    backend: vllm
    tokenizer: baselines/prompting/tokenizers/deepseek-8b
    model_path: ../hub/deepseek-ai/DeepSeek-R1-Distill-Llama-8B
    gen_max_tokens: 8192
