# CORRECT inference config — TracerTraj, local vLLM models.
# Closed-source API models have their own config: tracertraj-api.yaml.
models:  [qwen3.5-9b, deepseek-8b]
subsets: [code]
methods: [correct]

data_dir:     data/tracertraj
outputs_root: outputs/tracertraj
# Stage-1/2 artifacts (schemata, similarities) — never predictions.
artifacts_root: artifacts/tracertraj

# Paper setting (the vendored cloud path never includes the answer).
gt: without

# The schemata are keyed by their generator, not by the detector. tracertraj
# ships no committed gpt-4o schemata (the first pass is local-only, user
# decision 2026-09-07), so stage 1 runs here with qwen3.5-9b and both local
# detectors read artifacts/tracertraj/code/schemagen/qwen3.5-9b/. To match the
# other datasets, generate once with tracertraj-api.yaml (MODEL=gpt-4o
# STAGES=schemagen) and switch this key to gpt-4o.
schema_model: qwen3.5-9b
embed_model:  ../hub/BAAI/bge-m3    # stage 2 runs locally (CPU works, GPU faster)
num_schemata: 10                    # not in the paper; hand-crafted-like default (as traceelephant)

# Stage-1 sampling = the vendored schema generator's SamplingParams.
schema_gen: {temperature: 0.7, top_p: 0.95, gen_max_tokens: 1024}

# Detection sampling — greedy, as the vendored local inference.
dtype:          bfloat16
seed:           0
temperature:    0.0
top_p:          1.0
gen_max_tokens: 1024
enable_thinking: false

# Longest tracertraj history is ~73k Qwen tokens (median 5.9k); retrieved
# schemata add ~1k each.
max_model_len:          131072
truncate_prompt_tokens: null
gpu_memory_utilization: 0.90
tensor_parallel_size:   1

start_idx: 0
end_idx:   null

model_specs:
  qwen3.5-9b:
    backend: vllm
    model_path: ../hub/Qwen/Qwen3.5-9B
  deepseek-8b:
    backend: vllm
    model_path: ../hub/deepseek-ai/DeepSeek-R1-Distill-Llama-8B
    # Corrected tokenizer (see baselines/prompting/configs/ww.yaml).
    tokenizer: baselines/prompting/tokenizers/deepseek-8b
    # R1-Distill always emits <think>; 1024 would truncate the actual answer.
    gen_max_tokens: 8192
