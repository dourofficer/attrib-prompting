models:  [qwen3.5-9b, deepseek-8b, llama-3.1-8b, qwen3-8b, qwen3-14b, qwen3-27b]
subsets: [arc, gaia, hotpot, math500, mmlu_pro, musique, wikimqa]
data_dir: data/correct-error-gt

methods: [chief]

pred_root: outputs-correct-error-gt/chief

reps_root:   outputs-correct-error-gt/activations
split_model: qwen3.5-9b
splits: {train: 0.3, val: 0.2, test: 0.5}

crr_reduced_root: outputs-correct-error-gt/discounted-splits/reduced/325

out_root: outputs-correct-error-gt/chief-reports

# correct-error-gt restores the task answer (scripts/build_correct_error_gt.py),
# and CHIEF's stages interpolate it, so the answer IS in the prompts. Pairs 1:1
# with report_correct-error.yaml: same stems, therefore identical per-seed splits.
gt_in_prompt: true
