# CHIEF inference config — TraceElephant, local vLLM models.
# Closed-source API models have their own config: traceelephant-api.yaml.
models:  [qwen3.5-9b, deepseek-8b]
subsets: [magentic, captain]

data_dir:     data/traceelephant
outputs_root: outputs/traceelephant
# Stage-1 artifacts (retrieved exemplars) — never predictions.
artifacts_root: artifacts/traceelephant

# Vendored setting: every CHIEF stage prompt carries the task answer. The
# manuscript grid is the other one — pass GT=without on the front door.
gt: with

# The knowledge base is GAIA + AssistantBench whatever the dataset — CHIEF uses
# the exemplar as a decomposition template, not as domain knowledge. Keeping it
# on here keeps every prompt byte-identical to the vendored one. The artifact is
# keyed by the encoder, not the detector, so this config reuses the committed one.
rag:
  root:  vendored/CHIEF/rag
  kb:    [gaia, assistantbench]
  top_k: 2
  embed_model: sentence-transformers/all-MiniLM-L6-v2

# Detection sampling — greedy, as the vendored call_model (temperature 0).
dtype:          bfloat16
seed:           0
temperature:    0.0
top_p:          1.0
gen_max_tokens: 2048
enable_thinking: false

# Stages 5-6 inline the causal graph on top of the full history; the longest
# trajectories in this repo are ~98k tokens on their own.
max_model_len:          131072
truncate_prompt_tokens: null
gpu_memory_utilization: 0.90
tensor_parallel_size:   1

start_idx: 0
end_idx:   null

model_specs:
  qwen3.5-9b:
    backend: vllm
    model_path: ../hub/Qwen/Qwen3.5-9B
  deepseek-8b:
    backend: vllm
    model_path: ../hub/deepseek-ai/DeepSeek-R1-Distill-Llama-8B
    # Corrected tokenizer (see baselines/prompting/configs/ww.yaml).
    tokenizer: baselines/prompting/tokenizers/deepseek-8b
    # R1-Distill always emits <think>; 2048 would truncate the actual answer.
    gen_max_tokens: 8192
