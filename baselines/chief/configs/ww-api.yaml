# CHIEF inference config — Who&When (ww), closed-source API models.
# Requires the model's API key in the environment (default: OPENAI_API_KEY).
models:  [gpt-4o, gpt-5]
subsets: [algorithm-generated, hand-crafted]

data_dir:     data/ww
outputs_root: outputs/ww
# Stage-1 artifacts (retrieved exemplars) — never predictions.
artifacts_root: artifacts/ww

# Vendored setting: every CHIEF stage prompt carries the task answer.
gt: with

# Stage 1 retrieves a worked example from the committed GAIA + AssistantBench
# knowledge base. top_k is the vendored value; its [1:top_k] slice drops the best
# hit, so 2 injects exactly one exemplar (see IMPLEMENTATION.md).
rag:
  root:  vendored/CHIEF/rag
  kb:    [gaia, assistantbench]
  top_k: 2
  embed_model: sentence-transformers/all-MiniLM-L6-v2

start_idx: 0
end_idx:   null

# A spec's `params` are sent to the API verbatim — nothing else is added, and
# _run.json records exactly what was sent. CHIEF's stage 5 and 6 prompts inline
# the causal graph on top of the trajectory, so they need a generous budget.
model_specs:
  gpt-4o:
    backend: openai
    model: gpt-4o
    # temperature 0.0 is the vendored call_model value; without it the API
    # defaults to 1.0 and the six-stage chain stops being reproducible.
    params: {max_tokens: 8192, temperature: 0.0}
  gpt-5:
    backend: openai
    model: gpt-5
    # No temperature: reasoning models reject a non-default one. reasoning_effort
    # is left unset too, so the server default applies — add
    # `reasoning_effort: medium` to pin the level the paper reports for GPT-5.2
    # (Table 3). The cap is generous because reasoning tokens are drawn from it,
    # and a cap exhausted while thinking returns empty content, which parses to a
    # silent null prediction rather than an error.
    params: {max_completion_tokens: 16384}
