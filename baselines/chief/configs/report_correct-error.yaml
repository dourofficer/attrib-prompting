# Report config — CORRECT-Error, CHIEF baseline.
# Default GT setting is `with` (the vendored setting): reads outputs/ and writes
# outputs/correct-error/reports/chief.
# gpt-5 is deliberately NOT run on this dataset (6 calls × 2,226 trajectories ×
# 2 GT settings is too costly); listing it here would make --check-only report
# permanently missing rows. Add it back if that ever changes.
models:  [gpt-4o]                     # add local models here once they have run
subsets: [arc, gaia, hotpot, math500, mmlu_pro, musique, wikimqa]
methods: [chief]

gt: with

data_dir:  data/correct-error
pred_root: outputs/correct-error
out_root:  outputs/correct-error/reports/chief

splits: {train: 0.3, val: 0.2, test: 0.5}
seeds:  [1, 2, 3]

# Describes the with-GT tree only (restored answers); --gt without reports False.
gt_in_prompt: true
