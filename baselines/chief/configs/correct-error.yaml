models:  [qwen3.5-9b, deepseek-8b, llama-3.1-8b, qwen3-8b, qwen3-14b, qwen3-27b]
subsets: [arc, gaia, hotpot, math500, mmlu_pro, musique, wikimqa]

data_dir:     data/correct-error
outputs_root: outputs-correct-error/chief

mode: batched

dtype:          bfloat16
seed:           0
temperature:    0.0
top_p:          1.0
gen_max_tokens: 2048
enable_thinking: false

max_model_len:          131072
truncate_prompt_tokens: null
gpu_memory_utilization: 0.90
tensor_parallel_size:   1

start_idx: 0
end_idx:   null

# CORRECT-Error is off-domain for CHIEF's GAIA/AssistantBench KBs → RAG disabled.
# Flip enabled:true, kb:[gaia] to reuse Who&When's KB off-domain if desired.
rag:
  enabled: false
  kb: [gaia, assistantbench]
  root: baselines/CHIEF/rag
  top_k: 2

model_paths:
  qwen3.5-9b:   ../hub/Qwen/Qwen3.5-9B
  qwen3-8b:     ../hub/Qwen/Qwen3-8B
  qwen3-14b:    ../hub/Qwen/Qwen3-14B
  qwen3-27b:    ../hub/Qwen/Qwen3-27B
  llama-3.1-8b: ../hub/meta-llama/Llama-3.1-8B-Instruct
  deepseek-8b:  ../hub/deepseek-ai/DeepSeek-R1-Distill-Llama-8B

tokenizer_paths:
  deepseek-8b: baselines/prompting/tokenizers/deepseek-8b
