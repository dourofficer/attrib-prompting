models:  [qwen3.5-9b, deepseek-8b, llama-3.1-8b, qwen3-8b, qwen3-14b, qwen3-27b]
subsets: [algorithm-generated, hand-crafted]

data_dir:     data/ww
outputs_root: outputs-ww/chief

mode: batched          # batched (columnar, fast) | per_sample (faithful reference)

# CHIEF is greedy in the paper/vendored code → temperature 0.0.
dtype:          bfloat16
seed:           0
temperature:    0.0
top_p:          1.0
gen_max_tokens: 2048
enable_thinking: false          # toggle reasoning here (honored where the template supports it)

# Longest full-history prompt is tens of thousands of tokens; all four checkpoints
# natively support >=128k, so 131072 covers every trajectory with no truncation.
max_model_len:          131072
truncate_prompt_tokens: null
gpu_memory_utilization: 0.90
tensor_parallel_size:   1

start_idx: 0
end_idx:   null

# Who&When is CHIEF's native domain → faithful RAG over the vendored GAIA +
# AssistantBench knowledge bases.
rag:
  enabled: true
  kb: [gaia, assistantbench]
  root: baselines/CHIEF/rag
  top_k: 2

# model_paths:
#   qwen3.5-9b:   /data/hoang/resources/models/Qwen/Qwen3.5-9B
#   qwen3-8b:     /data/hoang/resources/models/Qwen/Qwen3-8B
#   llama-3.1-8b: /data/hoang/resources/models/meta-llama/Llama-3.1-8B-Instruct
#   deepseek-8b:  /data/hoang/resources/models/deepseek-ai/DeepSeek-R1-Distill-Llama-8B

model_paths:
  qwen3.5-9b:   ../hub/Qwen/Qwen3.5-9B
  qwen3-8b:     ../hub/Qwen/Qwen3-8B
  qwen3-14b:    ../hub/Qwen/Qwen3-14B
  qwen3-27b:    ../hub/Qwen/Qwen3-27B
  llama-3.1-8b: ../hub/meta-llama/Llama-3.1-8B-Instruct
  deepseek-8b:  ../hub/deepseek-ai/DeepSeek-R1-Distill-Llama-8B

# Corrected tokenizer for deepseek-8b (same fix the prompting baseline uses):
# its checkpoint tokenizer_config forces a SentencePiece tokenizer that mangles
# spaces; this repo-local copy fixes only tokenizer_class.
tokenizer_paths:
  deepseek-8b: baselines/prompting/tokenizers/deepseek-8b
