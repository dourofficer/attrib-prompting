# CHIEF inference config — CORRECT-Error, closed-source API models.
# Requires the model's API key in the environment (default: OPENAI_API_KEY).
models:  [gpt-4o, gpt-5]
subsets: [arc, gaia, hotpot, math500, mmlu_pro, musique, wikimqa]

data_dir:     data/correct-error
outputs_root: outputs/correct-error
# Stage-1 artifacts (retrieved exemplars) — never predictions.
artifacts_root: artifacts/correct-error

# Vendored setting: every CHIEF stage prompt carries the task answer.
gt: with

# The knowledge base is GAIA + AssistantBench whatever the dataset — CHIEF uses
# the exemplar as a decomposition template, not as domain knowledge. Keeping it
# on here keeps every prompt byte-identical to the vendored one.
rag:
  root:  vendored/CHIEF/rag
  kb:    [gaia, assistantbench]
  top_k: 2
  embed_model: sentence-transformers/all-MiniLM-L6-v2

start_idx: 0
end_idx:   null

model_specs:
  gpt-4o:
    backend: openai
    model: gpt-4o
    params: {max_tokens: 8192}
  gpt-5:
    backend: openai
    model: gpt-5
    params: {max_completion_tokens: 8192, reasoning_effort: medium}
